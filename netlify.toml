[build]
  command = "bun run build"
  publish = "dist"
  # Git pushes have no signed build grant. Exit 0 cancels them; hook builds
  # skip this command and still run.
  ignore = "bash scripts/netlify-hook-only.sh"

[build.environment]
  BUN_VERSION = "1.3.14"

# The Blox designer embeds this client-only route in an iframe; it is not
# prerendered, so serve the app shell.
[[redirects]]
  from = "/api/*"
  to = "https://dev-auctentic.bagel.to/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_blox_preview"
  to = "/index.html"
  status = 200
